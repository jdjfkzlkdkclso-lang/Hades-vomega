<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HADES TaskMaster Pro 💎</title><style>:root{--p:#00ff41;--bg:#0b0c10;--card:rgba(0,255,65,0.05);--warn:#ff00ff;--danger:#ff4444}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Courier New',monospace;background:linear-gradient(135deg,var(--bg),#1f2833,#000);color:var(--p);min-height:100vh;padding:20px}.container{max-width:1200px;margin:0 auto}.header{text-align:center;padding:30px;border:2px solid var(--p);margin-bottom:30px;background:rgba(0,0,0,.8);border-radius:12px;box-shadow:0 0 25px rgba(0,255,65,.2)}.header h1{font-size:3em;text-shadow:0 0 20px var(--p);margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:30px}.card{background:var(--card);border:1px solid var(--p);padding:20px;border-radius:8px;text-align:center;backdrop-filter:blur(5px)}.card h3{margin-bottom:10px;color:#fff;text-transform:uppercase}.value{font-size:2.5em;font-weight:700;text-shadow:0 0 15px var(--p)}.section{background:rgba(0,0,0,.7);border:1px solid var(--p);padding:25px;border-radius:10px;margin-bottom:20px}.section h2{color:var(--p);margin-bottom:20px;font-size:1.8em;border-bottom:1px dashed var(--p);padding-bottom:10px;text-transform:uppercase}.task{background:var(--card);border-left:4px solid var(--p);padding:15px;margin-bottom:10px;border-radius:5px;display:flex;justify-content:space-between;align-items:center}.cmd{color:#fff;font-size:1.1em;font-weight:700;word-break:break-all}.meta{color:#888;font-size:.85em}button{background:var(--p);color:#000;border:none;padding:12px 25px;border-radius:5px;cursor:pointer;font-weight:700;font-family:'Courier New',monospace;text-transform:uppercase}button.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}input{background:rgba(0,0,0,.8);border:1px solid var(--p);color:var(--p);padding:15px;border-radius:5px;width:100%;margin-bottom:15px;font-family:'Courier New',monospace;font-size:1.1em;outline:0}.logs{background:#050505;padding:15px;border-radius:5px;height:300px;overflow-y:auto;border:1px solid rgba(0,255,65,.3)}.log-line{margin-bottom:5px;border-bottom:1px solid #111;padding-bottom:3px;color:#aaa}.log-line:last-child{border-bottom:none;color:var(--p);font-weight:700}.flex{display:flex;gap:15px;flex-wrap:wrap}</style></head><body><div class="container"><div class="header"><h1>⚡ HADES TASKMASTER PRO</h1><p>N.C.P.C. DEPREDADOR⁹⁰ - ENLACE CUÁNTICO ACTIVO</p></div><div class="grid"><div class="card"><h3>Workers Core</h3><div class="value" id="workers">-</div></div><div class="card"><h3>Oracle AI</h3><div class="value" id="scheduler">-</div></div><div class="card"><h3>Matriz Tareas</h3><div class="value" id="taskCount">-</div></div><div class="card"><h3>Uptime Sesión</h3><div class="value" id="uptime">-</div></div></div><div class="section"><h2>🎮 Tablero de Ejecución</h2><div class="flex"><button onclick="cmd('start')">▶ START ENGINE</button><button onclick="cmd('stop')" class="danger">⏹ HALT SYSTEM</button><button onclick="fetchData()" style="background:transparent;border:1px solid var(--p);color:var(--p)">🔄 SYNC</button></div></div><div class="section"><h2>➕ Inyección de Algoritmo</h2><input type="text" id="c" placeholder="Escribir comando shell/bash (Ej: curl -s https://api.com/update)"><input type="number" id="i" placeholder="Ciclo temporal en segundos (Ej: 60)" value="60"><button onclick="add()" style="width:100%">INYECTAR AL ORÁCULO</button></div><div class="section"><h2>📋 Entidades Operativas</h2><div id="tasksList">Sincronizando...</div></div><div class="section"><h2>📊 Consola de Telemetría</h2><div class="logs" id="logs"></div></div></div><script>const API=location.origin+'/api';const st=Date.now();const $=id=>document.getElementById(id);async function fetchData(){try{const[sRes,tRes]=await Promise.all([fetch(`${API}/status`),fetch(`${API}/tasks`)]);const s=await sRes.json(),t=await tRes.json();$('workers').textContent=`${s.workers}/3`;$('scheduler').innerHTML=s.scheduler==='online'?'<span style="color:#00ff41;text-shadow:0 0 10px #00ff41">ONLINE</span>':'<span style="color:#ff4444;text-shadow:0 0 10px #ff4444">OFFLINE</span>';$('taskCount').textContent=t.length;$('uptime').textContent=`${Math.floor((Date.now()-st)/60000)}m`;$('logs').innerHTML=s.logs.map(l=>`<div class="log-line">${l}</div>`).join('');$('tasksList').innerHTML=t.map(x=>`<div class="task"><div><div class="cmd">${x.command} <span style="background:var(--warn);color:#000;padding:2px 8px;border-radius:3px;font-size:0.7em">ORACLE AI</span></div><div class="meta">ID: ${x.id} | Ciclo: ${x.interval}s</div></div><button class="danger" onclick="del('${x.id}')">🗑</button></div>`).join('');}catch(e){}}async function add(){const c=$('c').value,i=$('i').value;if(!c)return;await fetch(`${API}/tasks`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:c,interval:i})});$('c').value='';fetchData();}async function del(id){await fetch(`${API}/tasks/${id}`,{method:'DELETE'});fetchData();}async function cmd(a){await fetch(`${API}/control/${a}`,{method:'POST'});setTimeout(fetchData,1000);}setInterval(fetchData,3000);fetchData();</script></body></html>
